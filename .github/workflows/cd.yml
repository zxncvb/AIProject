name: enterprise-ai-platform-cd

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tag }}-backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tag }}-frontend
      - uses: docker/build-push-action@v6
        with:
          context: deploy/backup
          push: true
          tags: ${{ steps.meta.outputs.tag }}-backup
      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tag }}-backend
          format: cyclonedx-json
          output-file: sbom-backend.cdx.json
          artifact-name: sbom-backend.cdx.json
      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tag }}-frontend
          format: cyclonedx-json
          output-file: sbom-frontend.cdx.json
          artifact-name: sbom-frontend.cdx.json
      - name: Generate backup SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tag }}-backup
          format: cyclonedx-json
          output-file: sbom-backup.cdx.json
          artifact-name: sbom-backup.cdx.json
      - name: Scan published backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.meta.outputs.tag }}-backend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan published frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tag }}-frontend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan published backup image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tag }}-backup
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: sigstore/cosign-installer@v3
      - name: Sign published images
        env:
          IMAGE_PREFIX: ${{ steps.meta.outputs.tag }}
        run: |
          cosign sign --yes "${IMAGE_PREFIX}-backend"
          cosign sign --yes "${IMAGE_PREFIX}-frontend"
          cosign sign --yes "${IMAGE_PREFIX}-backup"

  deploy:
    needs: images
    if: github.ref == 'refs/heads/main' && vars.ENABLE_KUBERNETES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: sigstore/cosign-installer@v3
      - name: Verify image signatures
        env:
          IMAGE_PREFIX: ${{ needs.images.outputs.tag }}
        shell: bash
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "${IMAGE_PREFIX}-backend" >/dev/null
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "${IMAGE_PREFIX}-frontend" >/dev/null
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "${IMAGE_PREFIX}-backup" >/dev/null
      - shell: bash
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          # Create only the namespaces required by the migration first. The
          # application deployments are applied after the schema is current.
          kubectl apply -f deploy/k8s/namespace.yaml -f deploy/k8s/application-runtime-namespace.yaml
          kubectl -n enterprise-ai delete job enterprise-ai-migrate --ignore-not-found
          kubectl -n enterprise-ai create job enterprise-ai-migrate --image=${{ needs.images.outputs.tag }}-backend --dry-run=client -o yaml -- /usr/local/bin/alembic -c /app/alembic.ini upgrade head > /tmp/enterprise-ai-migrate.yaml
          kubectl -n enterprise-ai set env --local -f /tmp/enterprise-ai-migrate.yaml --from=secret/enterprise-ai-secrets -o yaml | kubectl apply -f -
          kubectl -n enterprise-ai patch job enterprise-ai-migrate --type=merge -p '{"spec":{"backoffLimit":0,"ttlSecondsAfterFinished":86400}}'
          kubectl -n enterprise-ai wait --for=condition=complete job/enterprise-ai-migrate --timeout=180s
          kubectl apply -k deploy/k8s
          kubectl -n enterprise-ai set image deployment/enterprise-ai-backend backend=${{ needs.images.outputs.tag }}-backend
          kubectl -n enterprise-ai set image deployment/enterprise-ai-worker worker=${{ needs.images.outputs.tag }}-backend
          kubectl -n enterprise-ai set image deployment/sandbox-controller controller=${{ needs.images.outputs.tag }}-backend
          kubectl -n enterprise-ai set image deployment/application-controller controller=${{ needs.images.outputs.tag }}-backend
          kubectl -n enterprise-ai set image deployment/enterprise-ai-frontend frontend=${{ needs.images.outputs.tag }}-frontend
          kubectl -n enterprise-ai set image cronjob/enterprise-ai-backup backup=${{ needs.images.outputs.tag }}-backup
          kubectl -n enterprise-ai rollout status deployment/enterprise-ai-backend --timeout=180s
          kubectl -n enterprise-ai rollout status deployment/enterprise-ai-worker --timeout=180s
          kubectl -n enterprise-ai rollout status deployment/sandbox-controller --timeout=180s
          kubectl -n enterprise-ai rollout status deployment/application-controller --timeout=180s
          kubectl -n enterprise-ai rollout status deployment/enterprise-ai-frontend --timeout=180s
          kubectl -n enterprise-ai exec deploy/enterprise-ai-backend -c backend -- python -c "import urllib.request; response=urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=10); assert response.status == 200"

  evaluation:
    needs: deploy
    if: github.ref == 'refs/heads/main' && vars.EVALUATION_BASE_URL != '' && vars.EVALUATION_DATASET_PATH != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: 下载评测集
        shell: bash
        env:
          DATASET_URL: ${{ vars.EVALUATION_DATASET_URL }}
        run: |
          if [ -n "$DATASET_URL" ]; then curl --fail --location "$DATASET_URL" --output deploy/ci/evaluation-dataset.json; fi
          test -s deploy/ci/evaluation-dataset.json
      - name: 执行评测门禁
        shell: pwsh
        env:
          EVALUATION_BASE_URL: ${{ vars.EVALUATION_BASE_URL }}
          EVALUATION_TOKEN: ${{ secrets.EVALUATION_TOKEN }}
          EVALUATION_DATASET_PATH: ${{ vars.EVALUATION_DATASET_PATH }}
        run: ./deploy/ci/evaluation-gate.ps1 -BaseUrl $env:EVALUATION_BASE_URL -Token $env:EVALUATION_TOKEN -DatasetPath $env:EVALUATION_DATASET_PATH

  rollback:
    needs: [deploy, evaluation]
    if: always() && github.ref == 'refs/heads/main' && vars.CANARY_WORKFLOW_ID != '' && (needs.deploy.result == 'failure' || needs.evaluation.result == 'failure')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: 自动回滚灰度版本
        shell: pwsh
        env:
          PLATFORM_BASE_URL: ${{ vars.EVALUATION_BASE_URL }}
          PLATFORM_TOKEN: ${{ secrets.EVALUATION_TOKEN }}
          CANARY_WORKFLOW_ID: ${{ vars.CANARY_WORKFLOW_ID }}
          PROMETHEUS_URL: ${{ vars.PROMETHEUS_URL }}
        run: ./deploy/ci/auto-rollback.ps1 -BaseUrl $env:PLATFORM_BASE_URL -Token $env:PLATFORM_TOKEN -WorkflowId $env:CANARY_WORKFLOW_ID -PrometheusUrl $env:PROMETHEUS_URL
