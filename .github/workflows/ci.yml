name: enterprise-ai-platform-ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: docker compose config --quiet
      - run: python -c "from pathlib import Path; assert 'application/json; charset=utf-8' in Path('backend/app/main.py').read_text(encoding='utf-8')"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --prefix frontend --no-audit --no-fund
      - run: npm run build --prefix frontend
