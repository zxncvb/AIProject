name: enterprise-ai-platform-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - name: 单元测试与覆盖率门禁
        run: >-
          PYTHONPATH=backend pytest -q backend/tests
          --cov=backend/app/services
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=20
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore
      - name: 校验 Docker Compose 配置
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-compose-validation-only
          POSTGRES_RUNTIME_PASSWORD: ci-runtime-validation-only
          GRAFANA_ADMIN_PASSWORD: ci-grafana-validation-only
      - run: python -c "from pathlib import Path; assert 'application/json; charset=utf-8' in Path('backend/app/main.py').read_text(encoding='utf-8')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --prefix frontend --no-audit --no-fund
      - run: npm run build --prefix frontend

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 生成本次 CI 专用的临时密钥
        shell: bash
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "POSTGRES_RUNTIME_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "APP_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "APP_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')=" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_EMAIL=admin" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=')" >> "$GITHUB_ENV"
      - name: 启动生产拓扑并执行迁移
        shell: bash
        run: |
          printf 'APP_ENV=test\nAPP_SECRET_KEY=%s\nAPP_ENCRYPTION_KEY=%s\nBOOTSTRAP_ADMIN_EMAIL=%s\nBOOTSTRAP_ADMIN_PASSWORD=%s\n' "$APP_SECRET_KEY" "$APP_ENCRYPTION_KEY" "$BOOTSTRAP_ADMIN_EMAIL" "$BOOTSTRAP_ADMIN_PASSWORD" > .env
          docker compose up -d --build postgres redis qdrant migrate db-security backend worker frontend
      - name: API 与中文界面冒烟测试
        shell: bash
        run: ./deploy/ci/smoke-test.sh
      - name: 负载与 SLO 门禁
        uses: grafana/setup-k6-action@v1
      - run: k6 run deploy/ci/load-test.js
        env:
          PLATFORM_BASE_URL: http://127.0.0.1:18080
          PLATFORM_ADMIN_USER: admin
          PLATFORM_ADMIN_PASSWORD: ${{ env.BOOTSTRAP_ADMIN_PASSWORD }}
      - name: 失败时输出服务日志
        if: failure()
        run: docker compose logs --no-color --tail=300 backend worker migrate db-security
      - if: always()
        run: docker compose down -v

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
