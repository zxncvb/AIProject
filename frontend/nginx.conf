server {
  listen 80;
  charset utf-8;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /public/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /healthz { proxy_pass http://backend:8080; }
  location /metrics { proxy_pass http://backend:8080; }
  location = /index.html { add_header Cache-Control "no-store, no-cache, must-revalidate"; }
  location / { try_files $uri /index.html; }
}
