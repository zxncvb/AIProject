# Apply these settings to the PostgreSQL primary and restart it when
# archive_mode or wal_level changes. The archive command must be reachable
# from the PostgreSQL container/host and WAL_ARCHIVE_URI must be injected into
# that process environment.
wal_level = replica
archive_mode = on
archive_timeout = 60s
# Replace the path with the mounted copy of deploy/backup/wal-archive.sh.
archive_command = '/usr/local/bin/wal-archive.sh "%p" "%f"'

# Keep enough WAL locally for the desired recovery window. The durable archive
# is the source of truth; monitor archive failures and disk usage separately.
max_wal_size = 4GB
min_wal_size = 1GB
