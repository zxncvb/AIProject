apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-ai-backend
  namespace: enterprise-ai
spec:
  replicas: 2
  selector:
    matchLabels: {app: enterprise-ai-backend}
  template:
    metadata:
      labels: {app: enterprise-ai-backend}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: enterprise-ai-platform/backend:latest
          ports: [{containerPort: 8080}]
          envFrom: [{secretRef: {name: enterprise-ai-secrets}}]
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "2", memory: "2Gi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: app-data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: app-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-ai-backend
  namespace: enterprise-ai
spec:
  selector: {app: enterprise-ai-backend}
  ports: [{port: 8080, targetPort: 8080}]
---
# Compatibility alias used by the same nginx.conf in Docker Compose and Kubernetes.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: enterprise-ai
spec:
  selector: {app: enterprise-ai-backend}
  ports: [{port: 8080, targetPort: 8080}]
