apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-ai-backend
  namespace: enterprise-ai
spec:
  podSelector: {matchLabels: {app: enterprise-ai-backend}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]
      ports: [{protocol: TCP, port: 8080}]
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: enterprise-ai}}}]
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: enterprise-ai}}}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports: [{protocol: TCP, port: 443}]
