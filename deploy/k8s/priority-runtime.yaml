apiVersion: v1
kind: Namespace
metadata:
  name: ai-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-controller
  namespace: ai-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-controller
  namespace: ai-platform
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-controller
  namespace: ai-platform
subjects:
  - kind: ServiceAccount
    name: sandbox-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-controller
  namespace: ai-platform
spec:
  replicas: 2
  selector:
    matchLabels: {app: sandbox-controller}
  template:
    metadata:
      labels: {app: sandbox-controller}
    spec:
      serviceAccountName: sandbox-controller
      containers:
        - name: controller
          image: enterprise-ai-platform/backend:latest
          command: ["python", "-m", "app.sandbox_controller"]
          envFrom:
            - secretRef: {name: ai-platform-env}
          env:
            - name: SANDBOX_NAMESPACE
              value: ai-platform
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-deny-network
  namespace: ai-platform
spec:
  podSelector:
    matchLabels: {ai.platform/sandbox: "true"}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
