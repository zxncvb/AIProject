apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-controller
  namespace: enterprise-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-controller
  namespace: enterprise-ai
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-controller
  namespace: enterprise-ai
subjects:
  - kind: ServiceAccount
    name: sandbox-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-controller
  namespace: enterprise-ai
spec:
  replicas: 2
  selector:
    matchLabels: {app: sandbox-controller}
  template:
    metadata:
      labels: {app: sandbox-controller}
    spec:
      serviceAccountName: sandbox-controller
      containers:
        - name: controller
          image: enterprise-ai-platform/backend:latest
          command: ["python", "-m", "app.sandbox_controller"]
          envFrom:
            - secretRef: {name: enterprise-ai-secrets}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: enterprise-ai-secrets
                  key: CONTROLLER_DATABASE_URL
            - name: DATABASE_ADMIN_URL
              value: ""
            - name: SANDBOX_NAMESPACE
              value: enterprise-ai
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-deny-network
  namespace: enterprise-ai
spec:
  podSelector:
    matchLabels: {ai.platform/sandbox: "true"}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
