apiVersion: v1
kind: Secret
metadata:
  name: enterprise-ai-secrets
  namespace: enterprise-ai
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://platform_runtime:replace@postgres.example:5432/platform
  DATABASE_ADMIN_URL: postgresql+asyncpg://platform:replace@postgres.example:5432/platform
  BACKUP_DATABASE_URL: postgresql://platform:replace@postgres.example:5432/platform
  BACKUP_S3_URI: s3://replace-with-offsite-bucket/platform-backups
  WAL_ARCHIVE_URI: s3://replace-with-offsite-bucket/platform-wal
  REDIS_URL: redis://redis:6379/0
  APP_ENV: production
  APP_SECRET_KEY: replace-with-random-32-byte-secret
  APP_ENCRYPTION_KEY: replace-with-fernet-key
  BOOTSTRAP_ADMIN_EMAIL: admin@example.com
  BOOTSTRAP_ADMIN_PASSWORD: replace-with-one-time-bootstrap-password
  TRUSTED_HOSTS: platform.example.com
  OIDC_CLIENT_SECRET: replace-me
  VAULT_TOKEN: replace-me
  APPLICATION_RUNTIME_NAMESPACE: enterprise-ai-apps
  APPLICATION_REGISTRY: ghcr.io/replace-with-your-organization
  APPLICATION_BASE_DOMAIN: apps.example.com
  APPLICATION_BUILDKIT_IMAGE: ghcr.io/moby/buildkit@sha256:replace-with-64-hex-digest
  SANDBOX_NODE_IMAGE: node@sha256:replace-with-64-hex-digest
  SANDBOX_PYTHON_IMAGE: python@sha256:replace-with-64-hex-digest
  SANDBOX_GO_IMAGE: golang@sha256:replace-with-64-hex-digest
  SANDBOX_JAVA_IMAGE: eclipse-temurin@sha256:replace-with-64-hex-digest
  PUBLICATION_SIGNING_SECRET: replace-with-random-webhook-signing-secret
