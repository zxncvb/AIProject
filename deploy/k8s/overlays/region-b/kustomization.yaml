apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: enterprise-ai-region-b
resources:
  - ../../namespace.yaml
  - ../../secrets.example.yaml
  - ../../backend.yaml
  - ../../frontend.yaml
  - ../../worker-gpu.yaml
  - ../../ingress.yaml
  - ../../hpa.yaml
  - ../../networkpolicy.yaml
  - ../../pdb.yaml
commonLabels:
  topology.kubernetes.io/region: region-b
patches:
  - target:
      kind: Namespace
      name: enterprise-ai
    patch: |-
      - op: replace
        path: /metadata/name
        value: enterprise-ai-region-b
  - target:
      kind: Deployment
      name: enterprise-ai-backend
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {topology.kubernetes.io/region: region-b}
  - target:
      kind: Deployment
      name: enterprise-ai-worker-gpu
    patch: |-
      - op: replace
        path: /spec/template/spec/nodeSelector
        value: {accelerator: nvidia, topology.kubernetes.io/region: region-b}
