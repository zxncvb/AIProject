# Reference only: replace with operator-managed PostgreSQL/Redis/Qdrant before production.
# Stateful failover requires synchronous replication, fencing and tested backups.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-postgres
  namespace: ai-platform
spec:
  instances: 3
  storage:
    size: 100Gi
  # CloudNativePG runs the WAL archiver and base-backup jobs. Replace the
  # destination and Secret name before applying this reference manifest.
  backup:
    barmanObjectStore:
      destinationPath: s3://REPLACE_WITH_DURABLE_BUCKET/platform-postgres
      s3Credentials:
        accessKeyId:
          name: platform-postgres-object-store
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: platform-postgres-object-store
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
  bootstrap:
    initdb:
      database: platform
      owner: platform
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: platform-redis
  namespace: ai-platform
spec:
  clusterSize: 3
  kubernetesConfig:
    image: redis:7.4-alpine
