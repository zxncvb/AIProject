apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-ai-worker-gpu
  namespace: enterprise-ai
spec:
  replicas: 2
  selector:
    matchLabels: {app: enterprise-ai-worker-gpu}
  template:
    metadata:
      labels: {app: enterprise-ai-worker-gpu}
    spec:
      nodeSelector:
        accelerator: nvidia
      containers:
        - name: worker
          image: enterprise-ai-platform/backend:latest
          command: ["python", "-m", "app.worker"]
          envFrom: [{secretRef: {name: enterprise-ai-secrets}}]
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "8Gi"
              nvidia.com/gpu: "1"
