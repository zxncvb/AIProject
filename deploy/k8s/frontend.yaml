apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-ai-frontend
  namespace: enterprise-ai
spec:
  replicas: 2
  selector:
    matchLabels: {app: enterprise-ai-frontend}
  template:
    metadata:
      labels: {app: enterprise-ai-frontend}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: enterprise-ai-platform/frontend:latest
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: 8080}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-ai-frontend
  namespace: enterprise-ai
spec:
  selector: {app: enterprise-ai-frontend}
  ports: [{port: 80, targetPort: 8080}]
