apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-ai-frontend
  namespace: enterprise-ai
spec:
  replicas: 2
  selector:
    matchLabels: {app: enterprise-ai-frontend}
  template:
    metadata:
      labels: {app: enterprise-ai-frontend}
    spec:
      containers:
        - name: frontend
          image: enterprise-ai-platform/frontend:latest
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-ai-frontend
  namespace: enterprise-ai
spec:
  selector: {app: enterprise-ai-frontend}
  ports: [{port: 80, targetPort: 80}]
